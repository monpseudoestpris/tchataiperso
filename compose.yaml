name: tchataiperso

services:
  clair-searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Exécutez ./scripts/install.sh ou configurez .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  clair-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tchat
      POSTGRES_USER: tchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécutez ./scripts/install.sh ou configurez .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tchat -d tchat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clair-api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tchat:${POSTGRES_PASSWORD}@clair-db:5432/tchat
      APP_DATA_DIR: /app/data
      # L'environnement du shell est prioritaire sur .env (clés cloud injectées).
      LLM_API_KEY: ${LLM_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEARXNG_URL: http://clair-searxng:8080
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
      EOD_HISTORICAL_DATA_KEY: ${EOD_HISTORICAL_DATA_KEY:-}
      ELEVEN_LABS_KEY: ${ELEVEN_LABS_KEY:-}
      BLOG_MODEL: ${BLOG_MODEL:-google/gemini-3.5-flash-lite}
      IMAGE_PROMPT_MODEL: ${IMAGE_PROMPT_MODEL:-google/gemini-4-argon}
      SKILL_PROMPT_MODEL: ${SKILL_PROMPT_MODEL:-google/gemini-4-argon}
      DEEP_SEARCH_MAX_TOKENS: ${DEEP_SEARCH_MAX_TOKENS:-131072}
      LEARN_MODE_MAX_TOKENS: ${LEARN_MODE_MAX_TOKENS:-98304}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      SUMMARY_TEMPERATURE: ${SUMMARY_TEMPERATURE:-0.1}
      DEEP_SEARCH_PLAN_MODEL: ${DEEP_SEARCH_PLAN_MODEL:-anthropic/claude-fable-5.1}
      DEEP_SEARCH_SYNTHESIS_MODEL: ${DEEP_SEARCH_SYNTHESIS_MODEL:-google/gemini-3.8-flash}
      WEB_SEARCH_DECISION_MODEL: ${WEB_SEARCH_DECISION_MODEL:-google/gemini-3.5-flash-lite}
      AUTO_WEB_SEARCH: ${AUTO_WEB_SEARCH:-true}
      HERMES_ENABLED: ${HERMES_ENABLED:-true}
      HERMES_API_URL: http://clair-hermes:8642
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_DEFAULT_MODEL: ${HERMES_DEFAULT_MODEL:-nousresearch/hermes-3-llama-3.1-405b}
      HERMES_MAX_COST_USD: ${HERMES_MAX_COST_USD:-0.25}
      # scripts/compose.sh --lan y ajoute l'origine http://<IP-LAN>:3001.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    volumes:
      - uploads_data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      clair-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  clair-web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://clair-api:8001
    environment:
      BACKEND_URL: http://clair-api:8001
      NODE_ENV: production
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
    ports:
      # WEB_BIND=0.0.0.0 (scripts/compose.sh --lan) expose le site au réseau local.
      - "${WEB_BIND:-127.0.0.1}:3001:3001"
    depends_on:
      clair-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  clair-hermes:
    build: ./hermes
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-}
      OPENROUTER_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      SEARXNG_URL: http://clair-searxng:8080
      CLAIR_MCP_URL: ${CLAIR_MCP_URL:-http://host.docker.internal:8001/api/hermes/mcp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hermes_data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
    ports:
      - "127.0.0.1:8642:8642"
    depends_on:
      - clair-searxng
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  hermes_data:
