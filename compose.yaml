name: tchataiperso

services:
  clair-searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Exécutez ./scripts/install.sh ou configurez .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  clair-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tchat
      POSTGRES_USER: tchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécutez ./scripts/install.sh ou configurez .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tchat -d tchat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clair-api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tchat:${POSTGRES_PASSWORD}@clair-db:5432/tchat
      APP_DATA_DIR: /app/data
      # L'environnement du shell est prioritaire sur .env (clés cloud injectées).
      LLM_API_KEY: ${LLM_API_KEY:-}
      SEARXNG_URL: http://clair-searxng:8080
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
      EOD_HISTORICAL_DATA_KEY: ${EOD_HISTORICAL_DATA_KEY:-}
      BLOG_MODEL: ${BLOG_MODEL:-google/gemini-3.5-flash-lite}
      IMAGE_PROMPT_MODEL: ${IMAGE_PROMPT_MODEL:-openai/gpt-6-luna}
      DEEP_SEARCH_MAX_TOKENS: ${DEEP_SEARCH_MAX_TOKENS:-12288}
      DEEP_SEARCH_PLAN_MODEL: ${DEEP_SEARCH_PLAN_MODEL:-anthropic/claude-fable-5.1}
      DEEP_SEARCH_SYNTHESIS_MODEL: ${DEEP_SEARCH_SYNTHESIS_MODEL:-google/gemini-3.8-flash}
      # scripts/compose.sh --lan y ajoute l'origine http://<IP-LAN>:3001.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    volumes:
      - uploads_data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      clair-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  clair-web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://clair-api:8001
    environment:
      BACKEND_URL: http://clair-api:8001
      NODE_ENV: production
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
    ports:
      # WEB_BIND=0.0.0.0 (scripts/compose.sh --lan) expose le site au réseau local.
      - "${WEB_BIND:-127.0.0.1}:3001:3001"
    depends_on:
      clair-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
