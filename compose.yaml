name: tchataiperso

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tchat
      POSTGRES_USER: tchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécutez ./scripts/install.sh ou configurez .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tchat -d tchat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tchat:${POSTGRES_PASSWORD}@db:5432/tchat
      APP_DATA_DIR: /app/data
      # L'environnement du shell est prioritaire sur .env (clés cloud injectées).
      LLM_API_KEY: ${LLM_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
    volumes:
      - uploads_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
