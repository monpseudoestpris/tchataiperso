use_default_settings:
  engines:
    keep_only:
      # Moteurs généralistes
      - duckduckgo
      - google
      - qwant
      - wikipedia

      # Recherche scientifique & académique
      - arxiv
      - openalex
      - pubmed
      - europepmc

      # Informatique & Documentation technique
      - mdn
      - microsoft learn

      # Actualités
      - reuters

      # Images
      - bing images
      - duckduckgo images
      - google images
      - qwant images
      - unsplash

      # Vidéos
      - youtube

search:
  default_lang: fr-FR
  safe_search: 1
  formats:
    - html
    - json

server:
  limiter: false

outgoing:
  request_timeout: 4.0

engines:
  - name: duckduckgo
    disabled: false
    weight: 1.0

  - name: google
    disabled: false
    weight: 1.0

  - name: qwant
    disabled: false
    weight: 0.7

  - name: wikipedia
    disabled: false
    weight: 0.9

  - name: arxiv
    disabled: false

  - name: openalex
    disabled: false

  - name: pubmed
    disabled: false

  - name: europepmc
    disabled: false

  - name: mdn
    disabled: false

  - name: microsoft learn
    disabled: false

  - name: reuters
    disabled: false

  # Images
  - name: bing images
    disabled: false

  - name: duckduckgo images
    disabled: false

  - name: google images
    disabled: false

  - name: qwant images
    disabled: false

  - name: unsplash
    disabled: false

  # Vidéos
  - name: youtube
    engine: youtube_noapi
    disabled: false
