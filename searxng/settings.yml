use_default_settings:
  engines:
    keep_only:
      # Moteurs généralistes
      - duckduckgo
      - google
      - qwant
      - bing

      # Recherche scientifique & académique
      - arxiv
      - openalex
      - pubmed
      - europepmc

      # Informatique & Documentation technique
      - mdn
      - microsoft learn

      # Actualités
      - reuters

search:
  default_lang: auto
  formats:
    - html
    - json

server:
  limiter: false

outgoing:
  request_timeout: 4.0

engines:
  - name: duckduckgo
    disabled: false
    weight: 1.0

  - name: google
    disabled: false
    weight: 1.0

  - name: qwant
    disabled: false
    weight: 0.7

  - name: bing
    disabled: false
    weight: 0.8

  - name: arxiv
    disabled: false

  - name: openalex
    disabled: false

  - name: pubmed
    disabled: false

  - name: europepmc
    disabled: false

  - name: mdn
    disabled: false

  - name: microsoft learn
    disabled: false

  - name: reuters
    disabled: false

    disabled: true
